<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Form Validation - FE1 Lesson 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }

        .form-container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="form-container">
            <h3 class="text-center mb-4">Đăng Ký Tài Khoản</h3>
            <form id="registrationForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullName" required>
                    <div class="invalid-feedback">Vui lòng nhập họ tên.</div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">Email không đúng định dạng.</div>
                </div>
                <div class="mb-3">
                    <label for="pwd" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="pwd" pattern="^(?=.*\d)(?=.*[\W_]).{6,}$" required>
                    <div class="invalid-feedback">
                        Mật khẩu phải có ít nhất 6 ký tự, gồm ít nhất 1 số và 1 ký tự đặc biệt.
                    </div>
                    <div class="valid-feedback">Mật khẩu hợp lệ!</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng ký ngay</button>
            </form>
        </div>
    </div>

    <script>
        // Lấy form cần kiểm tra
        const form = document.querySelector('#registrationForm')
        form.addEventListener('submit', function (event) {
            // Nếu form không hợp lệ theo các ràng buộc HTML5
            if (!form.checkValidity()) {
                event.preventDefault() // Chặn không cho gửi dữ liệu
                event.stopPropagation()
            }
            // Thêm class 'was-validated' để Bootstrap hiển thị màu xanh/đỏ
            form.classList.add('was-validated')
        })
    </script>

</body>

</html>
